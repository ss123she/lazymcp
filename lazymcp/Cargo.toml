[package]
name = "lazymcp"
description = "Thin, ergonomic macros for building MCP servers directly on the official rmcp SDK"
keywords = ["mcp", "rmcp", "macro", "agent"]
categories = ["asynchronous", "development-tools", "api-bindings"]
readme.workspace = true

version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
lazymcp-macros = { version = "0.1.2", path = "../lazymcp-macros" }

rmcp = "3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
