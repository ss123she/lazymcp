[package]
name = "lazymcp"
description = "Thin, ergonomic macros for building MCP servers directly on the official rmcp SDK"
keywords = ["mcp", "rmcp", "macro", "agent"]
categories = ["asynchronous", "development-tools", "api-bindings"]
readme.workspace = true

version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
lazymcp-macros = { version = "0.1.0", path = "../lazymcp-macros" }

rmcp = { version = "3.1.2"}
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
schemars = { version = "1.2.2" }
